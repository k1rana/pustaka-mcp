[project]
name = "pustaka-mcp"
version = "0.1.0"
description = "MCP server for searching thesis full text from 75+ Indonesian university repositories"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [
    { name = "Yingtze", email = "yingtze@users.noreply.github.com" },
    { name = "contributor" },
]
dependencies = [
    "mcp>=2.0.0,<3",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
pdf = ["pdfminer.six>=20221105"]
all = ["pustaka-mcp[pdf]"]

[project.urls]
Homepage = "https://github.com/yingtze/pencari-skripsi-indonesia"
Source = "https://github.com/yingtze/pencari-skripsi-indonesia"

[project.scripts]
pustaka = "pustaka.server:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pustaka"]
