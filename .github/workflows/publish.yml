name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - beta
          - patch
          - feat
          - major
      commit_message:
        description: "Commit message (conventional commit)"
        required: true
        type: string
        default: "chore: release"

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set Python
        run: uv python install

      - name: Calculate new version
        id: version
        shell: pwsh
        run: |
          $bump = "${{ github.event.inputs.bump }}"

          # Read current version
          $content = Get-Content src/pustaka/__init__.py -Raw
          if ($content -match '__version__ = "([^"]+)"') { $current = $matches[1] } else { $current = "0.1.0" }
          Write-Host "Current: $current"

          # Parse base version and beta suffix
          if ($current -match '^(\d+)\.(\d+)\.(\d+)(b\d+)?$') {
            $major = [int]$matches[1]; $minor = [int]$matches[2]; $patch = [int]$matches[3]
            $betaSuffix = $matches[4]
          } else {
            $major = 0; $minor = 1; $patch = 0; $betaSuffix = $null
          }

          switch ($bump) {
            "beta" {
              if ($betaSuffix -match 'b(\d+)') {
                $betaNum = [int]$matches[1] + 1
                $newVersion = "$major.$minor.$patch" + "b$betaNum"
              } else {
                # First beta: bump patch then add b1
                $patch++
                $newVersion = "$major.$minor.$patch" + "b1"
              }
            }
            "patch" { $newVersion = "$major.$minor.$($patch+1)" }
            "feat"  { $newVersion = "$($minor+1).0.0" }
            "major" { $newVersion = "$($major+1).0.0" }
          }

          Write-Host "New: $newVersion"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Bump version files (patch/feat/major only — commit & tag)
        if: github.event.inputs.bump != 'beta'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.new_version }}"
          (Get-Content src/pustaka/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content src/pustaka/__init__.py
          (Get-Content pyproject.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content pyproject.toml

          $msg = "${{ github.event.inputs.commit_message }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/pustaka/__init__.py pyproject.toml
          git commit -m "$msg

          Bump version to $v"
          git tag "v$v"
          git push origin HEAD --tags

      - name: Bump version files (beta only — no commit)
        if: github.event.inputs.bump == 'beta'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.new_version }}"
          (Get-Content src/pustaka/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content src/pustaka/__init__.py
          (Get-Content pyproject.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content pyproject.toml

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
