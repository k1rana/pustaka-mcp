name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - beta
          - patch
          - feat
          - major
      commit_message:
        description: "Commit message (conventional commit)"
        required: true
        type: string
        default: "chore: release"

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set Python
        run: uv python install

      - name: Calculate new version
        id: version
        shell: pwsh
        run: |
          $bump = "${{ github.event.inputs.bump }}"

          if ($bump -eq "beta") {
            # Query PyPI for latest published version
            $latest = $null
            try {
              $pypi = Invoke-RestMethod -Uri "https://pypi.org/pypi/pustaka-mcp/json" -ErrorAction Stop
              $versions = $pypi.releases.PSObject.Properties.Name
              $latest = $versions | Where-Object { $_ -match '^\d+\.\d+\.\d+(b\d+)?$' } | Sort-Object -Descending | Select-Object -First 1
            } catch {}

            if ($latest -match '^(\d+\.\d+\.\d+)b(\d+)$') {
              # Latest is beta — increment beta number
              $newVersion = "$($matches[1])b$([int]$matches[2] + 1)"
            } elseif ($latest -match '^(\d+\.\d+\.\d+)$') {
              # Latest is release — bump patch and add b1
              $parts = $matches[1].Split('.')
              $newVersion = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)b1"
            } else {
              # No published version — fallback to file-based
              $content = Get-Content src/pustaka/__init__.py -Raw
              $content -match '__version__ = "([^"]+)"' | Out-Null
              $current = if ($matches) { $matches[1] } else { "0.1.0" }
              $current -match '^(\d+)\.(\d+)\.(\d+)' | Out-Null
              $newVersion = "$($matches[1]).$($matches[2]).$([int]$matches[3] + 1)b1"
            }
          } else {
            # patch/feat/major: read file version
            $content = Get-Content src/pustaka/__init__.py -Raw
            $content -match '__version__ = "([^"]+)"' | Out-Null
            $current = if ($matches) { $matches[1] } else { "0.1.0" }
            $current -match '^(\d+)\.(\d+)\.(\d+)' | Out-Null
            $major = [int]$matches[1]; $minor = [int]$matches[2]; $patch = [int]$matches[3]
            switch ($bump) {
              "patch" { $newVersion = "$major.$minor.$($patch+1)" }
              "feat"  { $newVersion = "$($minor+1).0.0" }
              "major" { $newVersion = "$($major+1).0.0" }
            }
          }

          Write-Host "New: $newVersion"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Bump version files (patch/feat/major only — commit & tag)
        if: github.event.inputs.bump != 'beta'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.new_version }}"
          (Get-Content src/pustaka/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content src/pustaka/__init__.py
          (Get-Content pyproject.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content pyproject.toml

          $msg = "${{ github.event.inputs.commit_message }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/pustaka/__init__.py pyproject.toml
          git commit -m "$msg

          Bump version to $v"
          git tag "v$v"
          git push origin HEAD --tags

      - name: Bump version files (beta only — no commit)
        if: github.event.inputs.bump == 'beta'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.new_version }}"
          (Get-Content src/pustaka/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content src/pustaka/__init__.py
          (Get-Content pyproject.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content pyproject.toml

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
